<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" id="metaThemeColor" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SoftnixStore" />
  <meta name="description" content="SoftnixStore • NextGen E-Commerce Customer Mobile & Web App" />
  <title>SoftnixStore • NextGen E-Commerce App</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <div class="emulator-wrapper">
    <!-- Desktop Emulator Top Toolbar -->
    <div class="emulator-toolbar">
      <div class="toolbar-brand">
        <span>⚡ SoftnixStore</span>
        <span class="badge">E-Commerce App</span>
      </div>

      <div class="toolbar-actions">
        <!-- Device Switcher -->
        <button class="tool-btn device-mode-btn" data-mode="iphone" onclick="app.setDeviceMode('iphone')">
          📱 iPhone
        </button>
        <button class="tool-btn device-mode-btn" data-mode="android" onclick="app.setDeviceMode('android')">
          🤖 Android
        </button>
        <button class="tool-btn device-mode-btn active" data-mode="responsive"
          onclick="app.setDeviceMode('responsive')">
          💻 Laptop / Full View
        </button>

        <!-- Theme Toggle -->
        <button class="tool-btn" onclick="app.toggleTheme()">
          🌓 Theme
        </button>

        <!-- Install as PWA (shown when the browser offers an install prompt) -->
        <button class="tool-btn" id="installAppBtn" style="display:none;" onclick="app.installApp()">
          ⬇️ Install App
        </button>

        <!-- Reset State -->
        <button class="tool-btn" style="color:#f87171;" onclick="app.resetAllData()">
          🔄 Reset Data
        </button>
      </div>
    </div>

    <!-- Smartphone Hardware Shell Mockup -->
    <div class="device-container mode-iphone" id="deviceContainer">
      <!-- Notch / Dynamic Island -->
      <div class="device-notch">
        <span class="sensor"></span>
        <span style="font-size:9px; font-weight:700; color:#3b82f6;">● GPS Live</span>
        <span class="camera-lens"></span>
      </div>

      <!-- Smartphone Top Status Bar -->
      <div class="device-status-bar">
        <span>9:41</span>
        <div style="display:flex; align-items:center; gap:6px;">
          <span style="font-size:11px;">5G</span>
          <span style="font-size:11px;">100% 🔋</span>
        </div>
      </div>

      <!-- Application Core Shell -->
      <div class="app-shell">
        <!-- Sticky Mobile App Header -->
        <header class="app-header" id="appHeader">
          <!-- 1. Home Page Full Header (Home Only) -->
          <div class="header-row header-row-home" id="headerHome">
            <div class="header-left">
              <div class="brand-logo" onclick="app.navigate('home')" style="cursor:pointer;">
                <div class="brand-logo-icon">⚡</div>
                <span>SoftnixStore</span>
              </div>
            </div>

            <div class="header-right">
              <!-- Notification Bell with Counter -->
              <button class="header-icon-btn" onclick="app.navigate('notifications')" title="Notifications">
                <span>🔔</span>
                <span class="badge-counter notif-badge-count" style="display:none;">0</span>
              </button>

              <!-- Wishlist Heart with Counter -->
              <button class="header-icon-btn" onclick="app.navigate('wishlist')" title="Wishlist">
                <span>❤️</span>
                <span class="badge-counter wishlist-badge-count" style="display:none;">0</span>
              </button>

              <!-- Shopping Cart with Counter -->
              <button class="header-icon-btn" onclick="app.navigate('cart')" title="Shopping Cart">
                <span>🛒</span>
                <span class="badge-counter cart-badge-count" style="display:none;">0</span>
              </button>
            </div>
          </div>

          <!-- 2. Inner Pages Compact Navigation Header (All Other Pages) -->
          <div class="header-row header-row-inner" id="headerInner" style="display: none;">
            <div class="header-left">
              <button class="header-icon-btn" id="headerBackBtn" onclick="app.goBack()" aria-label="Go Back"
                title="Back" style="font-size:18px; font-weight:700; cursor:pointer;">
                <span>←</span>
              </button>
            </div>

            <div class="header-right">
              <!-- Notification Bell with Counter -->
              <button class="header-icon-btn" onclick="app.navigate('notifications')" title="Notifications">
                <span>🔔</span>
                <span class="badge-counter notif-badge-count" style="display:none;">0</span>
              </button>

              <!-- Shopping Cart with Counter -->
              <button class="header-icon-btn" onclick="app.navigate('cart')" title="Shopping Cart">
                <span>🛒</span>
                <span class="badge-counter cart-badge-count" style="display:none;">0</span>
              </button>
            </div>
          </div>
        </header>

        <!-- Scrollable Main App Content Views -->
        <main class="app-content" id="appContent">
          <!-- 1. Home / Storefront -->
          <div id="view-home" class="view-container active"></div>

          <!-- 2. Products -->
          <div id="view-products" class="view-container"></div>

          <!-- 3. Intelligent Search -->
          <div id="view-search" class="view-container"></div>

          <!-- 4. Product Details Page (PDP) -->
          <div id="view-pdp" class="view-container"></div>

          <!-- 5. Wishlist -->
          <div id="view-wishlist" class="view-container"></div>

          <!-- 6. Cart & Coupons -->
          <div id="view-cart" class="view-container"></div>

          <!-- 7. Multi-Step Checkout -->
          <div id="view-checkout" class="view-container"></div>

          <!-- 8. My Orders -->
          <div id="view-orders" class="view-container"></div>

          <!-- 9. Order Details -->
          <div id="view-order_details" class="view-container"></div>

          <!-- 9. Visual Order Tracking -->
          <div id="view-tracking" class="view-container"></div>

          <!-- 10. My Account & Settings -->
          <div id="view-account" class="view-container"></div>

          <!-- 11. Returns & Refunds Hub -->
          <div id="view-returns" class="view-container"></div>

          <!-- 12. Reviews & Ratings -->
          <div id="view-reviews" class="view-container"></div>

          <!-- 13. Notifications Center -->
          <div id="view-notifications" class="view-container"></div>

          <!-- 14. Customer Support & Live Chat -->
          <div id="view-support" class="view-container"></div>
        </main>

        <!-- Modern Sticky Bottom Navigation Bar -->
        <nav class="bottom-nav" id="bottomNav">
          <button class="nav-item active" data-target-view="home" onclick="app.navigate('home')">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
          </button>
          <button class="nav-item" data-target-view="products" onclick="app.navigate('products')">
            <span class="nav-icon">🛍️</span>
            <span>Products</span>
          </button>
          <button class="nav-item" data-target-view="orders" onclick="app.navigate('orders')">
            <span class="nav-icon">📦</span>
            <span>Orders</span>
            <span class="badge-counter" id="ordersNavBadge" style="top:2px; right:14px; display:none;">0</span>
          </button>
          <button class="nav-item" data-target-view="account" onclick="app.navigate('account')">
            <span class="nav-icon">👤</span>
            <span>Account</span>
          </button>
        </nav>

        <!-- Product Details Fixed Bottom Action Bar -->
        <div class="pdp-bottom-bar" id="pdpBottomBar" style="display: none;">
          <button class="pdp-action-btn btn-add-cart" id="pdpAddToCartBtn" onclick="app.handlePDPAddToCart()">
            🛒 Add to Cart
          </button>
          <button class="pdp-action-btn btn-buy-now" id="pdpBuyNowBtn" onclick="app.handlePDPBuyNow()">
            ⚡ Buy Now
          </button>
        </div>
        <!-- Global Modal / Bottom Sheet Overlay -->
        <div class="modal-overlay" id="appModalOverlay"></div>

        <!-- Floating Toast Notification Manager -->
        <div class="toast-container" id="toastContainer"></div>
      </div>

      <!-- Smartphone Hardware Bottom Home Bar -->
      <div class="device-home-indicator"></div>
    </div>

    <!-- Application Scripts -->
    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
